version: '3.8'

services:
  db:
    image: postgres:15
    container_name: io_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: project_management
    ports:
      - ":5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d project_management"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  api:
    build: ./backend
    container_name: io_fastapi
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/project_management
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    restart: always

  web:
    build: ./frontend
    container_name: io_frontend
    ports:
      - "8001:80"
    depends_on:
      - api
    volumes:
      - ./frontend:/usr/share/nginx/html
    restart: always

volumes:
  postgres_data:
